<?xml version="1.0" encoding="UTF-8"?>
<!--
  AllOffice app icon, small optical size (16-32 px slots) (source of truth).

  Four tiles in a grid: every kind of document in one place. The accent tile
  stands for the AI that works on them. Original drawing for AllOffice.

  Every raster/container icon in the repo is derived from the brand SVGs:
    node tools/gen-brand-assets.mjs
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" rx="230" fill="#0F766E"/>
  <rect x="192" y="192" width="272" height="272" rx="60" fill="#FFFFFF"/>
  <rect x="560" y="192" width="272" height="272" rx="60" fill="#FFFFFF"/>
  <rect x="192" y="560" width="272" height="272" rx="60" fill="#FFFFFF"/>
  <rect x="560" y="560" width="272" height="272" rx="60" fill="#FBBF24"/>
</svg>
