<?xml version="1.0" encoding="UTF-8"?>
<!--
  AllOffice logo lockup (in-app sidebar logo; pure black and white, the shell inverts it for dark themes) (source of truth).

  Four tiles in a grid: every kind of document in one place. The accent tile
  stands for the AI that works on them. Original drawing for AllOffice.

  Every raster/container icon in the repo is derived from the brand SVGs:
    node tools/gen-brand-assets.mjs
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1091" height="240" viewBox="0 0 1091 240" fill="none">
  <svg width="240" height="240" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" rx="230" fill="black"/>
  <rect x="232" y="232" width="248" height="248" rx="55" fill="white"/>
  <rect x="544" y="232" width="248" height="248" rx="55" fill="white"/>
  <rect x="232" y="544" width="248" height="248" rx="55" fill="white"/>
  <rect x="544" y="544" width="248" height="248" rx="55" fill="white"/>
  </svg>
  <text x="290" y="168" fill="black" font-family="'Segoe UI', 'Malgun Gothic', Roboto, Arial, sans-serif" font-size="150" font-weight="700" letter-spacing="-3">AllOffice</text>
</svg>
